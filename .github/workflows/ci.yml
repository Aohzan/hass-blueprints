name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deprecated-blueprints:
    name: Deprecated blueprints up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/build-deprecated-blueprints.sh
      - name: Fail when the generated files differ
        run: git diff --exit-code

  test:
    name: Tests (Home Assistant ${{ matrix.home-assistant }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - home-assistant: oldest supported
            python: "3.12"
            requirements: tests/requirements_oldest.txt
            # Resolve the dependencies as they were at the 2024.10.0 release.
            exclude-newer: "2024-10-10T00:00:00Z"
          - home-assistant: latest
            python: "3.14"
            requirements: requirements_test.txt
            exclude-newer: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: scripts/test.sh
        env:
          PYTHON: ${{ matrix.python }}
          REQUIREMENTS: ${{ matrix.requirements }}
          EXCLUDE_NEWER: ${{ matrix.exclude-newer }}
